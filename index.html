<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シフト入力</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #EEF2F6; min-height: 100vh;
      padding: 10px 10px 110px;
      color: #26323D;
    }

    /* ===== タブ ===== */
    .tabs { display: flex; background: #fff; border-radius: 14px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
    .tab { flex: 1; padding: 15px 8px; text-align: center; font-size: 15px; font-weight: 700; color: #97A3AE; border-bottom: 3px solid transparent; }
    .tab.active { color: #2D5F8A; border-bottom-color: #2D5F8A; }

    /* ===== 進捗バー ===== */
    .progress-wrap { background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #6B7986; margin-bottom: 8px; }
    .progress-label b { color: #2D5F8A; }
    .progress-track { height: 8px; background: #EEF2F6; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #2D5F8A, #4A90D9); border-radius: 99px; width: 0%; transition: width .3s ease; }

    .edit-banner {
      display: none; align-items: center; gap: 8px;
      background: #FFF6E5; border: 1.5px solid #F5C860; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #8A6416;
    }
    .edit-banner.show { display: flex; }

    /* ===== カード ===== */
    .card {
      background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,.07); transition: box-shadow .2s ease, border-color .2s ease;
      border: 2px solid transparent; scroll-margin-top: 12px;
    }
    .card.done { border-color: #C8E6C9; }
    .card-label {
      font-size: 13px; font-weight: 700; color: #6B7986; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; background: #2D5F8A; color: #fff;
      font-size: 12px; font-weight: 700; flex-shrink: 0; transition: background .2s ease;
    }
    .card.done .step-num { background: #2E7D32; }
    .step-label-text { flex-shrink: 0; }
    .step-done-summary {
      font-size: 12.5px; font-weight: 700; color: #2E7D32;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right;
    }

    /* ===== チップボタン（選択式）===== */
    .chips { display: grid; gap: 8px; }
    .chips.cols3 { grid-template-columns: repeat(3, 1fr); }
    .chips.cols4 { grid-template-columns: repeat(4, 1fr); }
    .chips.cols2 { grid-template-columns: repeat(2, 1fr); }
    .chip {
      padding: 15px 4px; border: 2px solid #DDE4EA; border-radius: 12px;
      background: #FAFBFC; text-align: center; font-size: 15px; font-weight: 700;
      color: #4A5865; min-height: 54px; display: flex; align-items: center; justify-content: center;
      transition: transform .05s;
    }
    .chip:active { transform: scale(.95); }
    .chip.selected { border-color: #2D5F8A; background: #2D5F8A; color: #fff; }

    .auto-badge { background: #E8F5E9; color: #2E7D32; border-radius: 6px; font-size: 11px; padding: 2px 8px; font-weight: 700; }

    /* ===== テキスト入力 ===== */
    input[type="text"] {
      width: 100%; padding: 15px 14px; border: 2px solid #DDE4EA; border-radius: 12px;
      font-size: 16px; background: #FAFBFC; color: #26323D;
    }
    input[type="text"]:focus { outline: none; border-color: #2D5F8A; background: #fff; }
    .input-gap { margin-top: 12px; }
    .field-label { font-size: 13px; font-weight: 700; color: #6B7986; margin-bottom: 8px; }
    .quick-places { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .qp {
      padding: 8px 12px; border-radius: 20px; border: 1px solid #DDE4EA;
      background: #fff; font-size: 13px; color: #4A5865; font-weight: 600;
    }
    .qp:active { background: #EEF2F6; }

    /* ===== カレンダー ===== */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-nav { background: #F2F6F9; border: none; border-radius: 10px; width: 48px; height: 44px; font-size: 18px; color: #2D5F8A; font-weight: 700; }
    .cal-nav:active { background: #DDE8F0; }
    .cal-title { font-size: 17px; font-weight: 800; color: #2D5F8A; }
    .cal-dow-grid, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 11px; color: #97A3AE; padding: 4px 0; font-weight: 700; }
    .cal-dow.sat { color: #1565C0; } .cal-dow.sun { color: #C62828; }
    .cal-day {
      text-align: center; font-size: 17px; font-weight: 600; border-radius: 10px;
      color: #26323D; min-height: 50px; display: flex; align-items: center; justify-content: center;
    }
    .cal-day:active { opacity: .6; }
    .cal-day.sat { color: #1565C0; } .cal-day.sun { color: #C62828; }
    .cal-day.start, .cal-day.end { background: #2D5F8A !important; color: #fff !important; font-weight: 800; }
    .cal-day.in-range { background: #C6DCF2; color: #0C447C; border-radius: 0; }
    .cal-day.empty { pointer-events: none; }
    .range-info { text-align: center; margin-top: 10px; font-size: 14px; font-weight: 700; color: #97A3AE; min-height: 20px; }
    .range-info.set { color: #2D5F8A; }

    /* ===== スティッキー送信バー ===== */
    .submit-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: rgba(255,255,255,.97); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 12px rgba(0,0,0,.1);
    }
    .summary { font-size: 12px; color: #6B7986; margin-bottom: 8px; text-align: center; min-height: 15px; font-weight: 600; }
    .btn-submit {
      width: 100%; padding: 16px; background: #2D5F8A; color: #fff; border: none;
      border-radius: 12px; font-size: 17px; font-weight: 800; min-height: 54px;
    }
    .btn-submit:active { background: #1a4a6e; transform: scale(.98); }
    .btn-submit:disabled { background: #B8C4CE; }
    #result { text-align: center; font-size: 14px; font-weight: 700; min-height: 18px; margin-top: 6px; }
    .success { color: #2E7D32; } .error-msg { color: #C62828; }

    /* ===== 確認タブ ===== */
    .shift-item { border: 1px solid #E3E9EE; border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #FAFBFC; }
    .shift-item .date-label { font-size: 16px; font-weight: 800; color: #2D5F8A; margin-bottom: 6px; }
    .shift-item .detail { font-size: 14px; margin-bottom: 3px; }
    .shift-item .detail span { color: #97A3AE; font-size: 12px; margin-right: 6px; }
    .shift-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-edit, .btn-delete { flex: 1; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; background: #fff; min-height: 48px; }
    .btn-edit { border: 2px solid #2D5F8A; color: #2D5F8A; }
    .btn-delete { border: 2px solid #E53935; color: #E53935; }
    .empty-msg, .loading-msg { text-align: center; color: #AAB4BD; font-size: 14px; padding: 30px 0; }

    .page { display: none; }
    .page.active { display: block; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>

  <div class="tabs">
    <div class="tab active" id="tab-input" onclick="switchTab('input')">入力</div>
    <div class="tab" id="tab-confirm" onclick="switchTab('confirm')">確認・修正</div>
  </div>

  <!-- ===== 入力タブ ===== -->
  <div id="page-input" class="page active">

    <div class="progress-wrap">
      <div class="progress-label"><span>入力の進み具合</span><span><b id="progress-count">0</b>/<span id="progress-total">5</span> 完了</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="edit-banner" id="edit-banner">✏️ 修正モード：内容を変更して送信してください</div>

    <div class="card" id="step-name">
      <div class="card-label">
        <span class="step-num" id="stepnum-name">1</span>
        <span class="step-label-text">名前</span>
        <span class="step-done-summary" id="stepsum-name"></span>
      </div>
      <div class="chips cols3" id="chips-name">
        <button class="chip" data-value="山口">山口</button>
        <button class="chip" data-value="鈴木">鈴木</button>
        <button class="chip" data-value="毛利">毛利</button>
      </div>
    </div>

    <div class="card" id="step-torihiki">
      <div class="card-label">
        <span class="step-num" id="stepnum-torihiki">2</span>
        <span class="step-label-text">取引先</span>
        <span class="step-done-summary" id="stepsum-torihiki"></span>
      </div>
      <div class="chips cols2" id="chips-torihiki">
        <button class="chip" data-value="南国殖産">南国殖産</button>
        <button class="chip" data-value="ハイコム">ハイコム</button>
        <button class="chip" data-value="サンコミ">サンコミ</button>
        <button class="chip" data-value="ダル">ダル</button>
      </div>
    </div>

    <div class="card" id="step-carrier">
      <div class="card-label">
        <span class="step-num" id="stepnum-carrier">3</span>
        <span class="step-label-text">キャリア</span>
        <span class="auto-badge" id="auto-badge" style="display:none;">自動選択</span>
        <span class="step-done-summary" id="stepsum-carrier"></span>
      </div>
      <div class="chips cols3" id="chips-carrier">
        <button class="chip" data-value="docomo">docomo</button>
        <button class="chip" data-value="au">au</button>
        <button class="chip" data-value="SoftBank">SoftBank</button>
      </div>
    </div>

    <div class="card" id="step-date">
      <div class="card-label">
        <span class="step-num" id="stepnum-date">4</span>
        <span class="step-label-text">期間（開始日 → 終了日の順にタップ）</span>
        <span class="step-done-summary" id="stepsum-date"></span>
      </div>
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">◀</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-nav" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="cal-dow-grid">
        <div class="cal-dow">月</div><div class="cal-dow">火</div><div class="cal-dow">水</div>
        <div class="cal-dow">木</div><div class="cal-dow">金</div>
        <div class="cal-dow sat">土</div><div class="cal-dow sun">日</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="range-info" id="rangeInfo">開始日をタップ</div>
    </div>

    <div class="card" id="step-place">
      <div class="card-label">
        <span class="step-num" id="stepnum-place">5</span>
        <span class="step-label-text">開催場所</span>
        <span class="step-done-summary" id="stepsum-place"></span>
      </div>
      <input type="text" id="place" placeholder="例: 下通、ゆめタウン博多" oninput="onPlaceInput()">
      <div class="quick-places" id="quick-places"></div>
      <div class="input-gap">
        <div class="field-label">ホテル（任意）</div>
        <input type="text" id="hotel" placeholder="宿泊先ホテル名" oninput="onPlaceInput()">
      </div>
    </div>

  </div>

  <!-- ===== 確認・修正タブ ===== -->
  <div id="page-confirm" class="page">
    <div class="card">
      <div class="card-label" style="justify-content:flex-start;">名前を選択</div>
      <div class="chips cols3" id="chips-confirm-name">
        <button class="chip" data-value="山口">山口</button>
        <button class="chip" data-value="鈴木">鈴木</button>
        <button class="chip" data-value="毛利">毛利</button>
      </div>
    </div>
    <div id="shift-list"></div>
  </div>

  <!-- ===== スティッキー送信バー ===== -->
  <div class="submit-bar" id="submit-bar">
    <div class="summary" id="summary"></div>
    <button class="btn-submit" id="btn-submit" onclick="submitForm()">送信する</button>
    <div id="result"></div>
  </div>

<script>
  // ▼▼▼ GASのWebアプリURL（/execで終わるもの） ▼▼▼
  var GAS_URL = "https://script.google.com/macros/s/AKfycbwx4-wjr4Qmx6zeXDXZhht-65W7veveJvaXXmC9V5MQLipOLxLoWfz-XEUBau8NZ58h/exec";

  var calYear, calMonth, startDay = null, endDay = null;
  var sel = { name: '', torihiki: '', carrier: '' };
  var confirmName = '';
  var carrierAutoSet = false;
  var editMode = false;

  var urlParams = new URLSearchParams(window.location.search);
  var staffFromUrl = urlParams.get('staff');

  var stepOrder = staffFromUrl
    ? ['torihiki', 'carrier', 'date', 'place']
    : ['name', 'torihiki', 'carrier', 'date', 'place'];

  var QUICK_PLACES = ['下通', 'ゆめタウン博多', 'ゆめタウン光の森', 'イオンモール熊本'];

  // ── GASとの通信（共通関数）タイムアウト付き ─────────────────────────
  function callApi(action, params, timeoutMs) {
    timeoutMs = timeoutMs || 15000;
    var body = Object.assign({ action: action }, params || {});

    return new Promise(function(resolve, reject) {
      var timedOut = false;
      var timer = setTimeout(function() {
        timedOut = true;
        reject(new Error('通信がタイムアウトしました（' + (timeoutMs/1000) + '秒）。電波状況を確認して再試行してください。'));
      }, timeoutMs);

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(body)
      })
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (timedOut) return;
          clearTimeout(timer);
          if (!json.ok) {
            reject(new Error(json.error || '不明なエラー'));
          } else {
            resolve(json.data);
          }
        })
        .catch(function(err) {
          if (timedOut) return;
          clearTimeout(timer);
          reject(new Error('通信エラー: ' + err.message));
        });
    });
  }

  callApi('getMonthInfo')
    .then(function(info) {
      calYear = info.year;
      calMonth = info.month;
      renderCal();
    })
    .catch(function(err) {
      document.getElementById('calGrid').innerHTML = '';
      document.getElementById('rangeInfo').textContent = '読み込みエラー: ' + err.message;
    });

  // ===== チップ選択のセットアップ =====
  function setupChips(containerId, key, onChange) {
    var container = document.getElementById(containerId);
    container.querySelectorAll('.chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        container.querySelectorAll('.chip').forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        if (key) sel[key] = btn.dataset.value;
        if (onChange) onChange(btn.dataset.value);
        updateSummary();
        if (navigator.vibrate) navigator.vibrate(10);
      });
    });
  }

  setupChips('chips-name', 'name', function() {
    updateProgress();
    if (!editMode) scrollToNextAfter('name');
  });
  setupChips('chips-torihiki', 'torihiki', function(v) {
    var auto = { 'ハイコム': 'SoftBank', 'サンコミ': 'au' };
    var badge = document.getElementById('auto-badge');
    if (auto[v]) {
      selectChip('chips-carrier', auto[v]);
      sel.carrier = auto[v];
      carrierAutoSet = true;
      badge.style.display = 'inline-block';
    } else {
      if (carrierAutoSet) { clearChips('chips-carrier'); sel.carrier = ''; carrierAutoSet = false; }
      badge.style.display = 'none';
    }
    updateSummary();
    updateProgress();
    if (!editMode) scrollToNextAfter('torihiki');
  });
  setupChips('chips-carrier', 'carrier', function() {
    carrierAutoSet = false;
    document.getElementById('auto-badge').style.display = 'none';
    updateProgress();
    if (!editMode) scrollToNextAfter('carrier');
  });
  setupChips('chips-confirm-name', null, function(v) {
    confirmName = v;
    loadMyShifts();
  });

  if (staffFromUrl) {
    sel.name = staffFromUrl;
    confirmName = staffFromUrl;
    document.getElementById('step-name').style.display = 'none';
    selectChip('chips-name', staffFromUrl);
    selectChip('chips-confirm-name', staffFromUrl);
    updateSummary();
  }

  function selectChip(containerId, value) {
    var container = document.getElementById(containerId);
    container.querySelectorAll('.chip').forEach(function(b) {
      b.classList.toggle('selected', b.dataset.value === value);
    });
  }
  function clearChips(containerId) {
    document.getElementById(containerId).querySelectorAll('.chip').forEach(function(b) { b.classList.remove('selected'); });
  }

  // ===== よく使う場所 =====
  (function() {
    var wrap = document.getElementById('quick-places');
    QUICK_PLACES.forEach(function(p) {
      var b = document.createElement('button');
      b.className = 'qp';
      b.textContent = p;
      b.onclick = function() {
        document.getElementById('place').value = p;
        onPlaceInput();
        if (navigator.vibrate) navigator.vibrate(10);
      };
      wrap.appendChild(b);
    });
  })();

  function onPlaceInput() {
    updateSummary();
    updateProgress();
  }

  // ===== 進捗・完了マーク =====
  function isStepComplete(id) {
    if (id === 'name')     return !!sel.name;
    if (id === 'torihiki') return !!sel.torihiki;
    if (id === 'carrier')  return !!sel.carrier;
    if (id === 'date')     return !!(startDay && endDay);
    if (id === 'place')    return !!document.getElementById('place').value;
    return false;
  }

  function getSummaryText(id) {
    if (id === 'name')     return sel.name ? ('✓ ' + sel.name) : '';
    if (id === 'torihiki') return sel.torihiki ? ('✓ ' + sel.torihiki) : '';
    if (id === 'carrier')  return sel.carrier ? ('✓ ' + sel.carrier + (carrierAutoSet ? '（自動）' : '')) : '';
    if (id === 'date') {
      if (!startDay) return '';
      var txt = calMonth + '月' + startDay + '日' + (endDay && endDay !== startDay ? '〜' + endDay + '日' : '');
      return endDay ? ('✓ ' + txt) : txt;
    }
    if (id === 'place') {
      var p = document.getElementById('place').value;
      if (!p) return '';
      var h = document.getElementById('hotel').value;
      return '✓ ' + (h ? (p + '（' + h + '）') : p);
    }
    return '';
  }

  function updateProgress() {
    var completedCount = 0;
    stepOrder.forEach(function(id) {
      var card = document.getElementById('step-' + id);
      var complete = isStepComplete(id);
      if (complete) completedCount++;
      if (card) card.classList.toggle('done', complete);
      var numEl = document.getElementById('stepnum-' + id);
      if (numEl) numEl.textContent = complete ? '✓' : numEl.getAttribute('data-num');
      var sumEl = document.getElementById('stepsum-' + id);
      if (sumEl) sumEl.textContent = getSummaryText(id);
    });
    document.getElementById('progress-count').textContent = completedCount;
    document.getElementById('progress-total').textContent = stepOrder.length;
    var pct = Math.round((completedCount / stepOrder.length) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  document.querySelectorAll('.step-num').forEach(function(el) {
    el.setAttribute('data-num', el.textContent);
  });

  function scrollToStep(id) {
    var el = document.getElementById('step-' + id);
    if (!el) return;
    setTimeout(function() {
      var y = el.getBoundingClientRect().top + window.pageYOffset - 10;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }, 120);
  }

  function scrollToNextAfter(id) {
    var idx = stepOrder.indexOf(id);
    for (var i = idx + 1; i < stepOrder.length; i++) {
      if (!isStepComplete(stepOrder[i])) {
        scrollToStep(stepOrder[i]);
        return;
      }
    }
  }

  updateProgress();

  // ===== タブ切替 =====
  function switchTab(tab) {
    document.getElementById('tab-input').classList.toggle('active', tab === 'input');
    document.getElementById('tab-confirm').classList.toggle('active', tab === 'confirm');
    document.getElementById('page-input').classList.toggle('active', tab === 'input');
    document.getElementById('page-confirm').classList.toggle('active', tab === 'confirm');
    document.getElementById('submit-bar').style.display = (tab === 'input') ? 'block' : 'none';
  }

  // ===== カレンダー =====
  function changeMonth(d) {
    calMonth += d;
    if (calMonth > 12) { calMonth = 1; calYear++; }
    if (calMonth < 1) { calMonth = 12; calYear--; }
    startDay = null; endDay = null;
    renderCal();
    updateSummary();
    updateProgress();
  }

  function renderCal() {
    document.getElementById('calTitle').textContent = calYear + '年' + calMonth + '月';
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    var firstWd = new Date(calYear, calMonth - 1, 1).getDay();
    var offset = (firstWd === 0) ? 6 : firstWd - 1;
    var daysInMonth = new Date(calYear, calMonth, 0).getDate();

    for (var i = 0; i < offset; i++) {
      var blank = document.createElement('div');
      blank.className = 'cal-day empty';
      grid.appendChild(blank);
    }
    for (var d = 1; d <= daysInMonth; d++) {
      (function(day) {
        var wd = new Date(calYear, calMonth - 1, day).getDay();
        var div = document.createElement('div');
        div.textContent = day;
        div.className = 'cal-day';
        if (wd === 6) div.classList.add('sat');
        if (wd === 0) div.classList.add('sun');
        if (startDay && endDay && day > startDay && day < endDay) div.classList.add('in-range');
        if (startDay && day === startDay) div.classList.add('start');
        if (endDay && day === endDay) div.classList.add('end');
        div.onclick = function() {
          var wasComplete = !!(startDay && endDay);
          if (!startDay || (startDay && endDay)) {
            startDay = day; endDay = null;
          } else {
            if (day < startDay) { endDay = startDay; startDay = day; }
            else { endDay = day; }
          }
          if (navigator.vibrate) navigator.vibrate(10);
          updateRangeInfo();
          renderCal();
          updateSummary();
          updateProgress();
          if (!wasComplete && startDay && endDay && !editMode) {
            scrollToNextAfter('date');
          }
        };
        grid.appendChild(div);
      })(d);
    }
    updateRangeInfo();
  }

  function updateRangeInfo() {
    var el = document.getElementById('rangeInfo');
    if (startDay && endDay) {
      el.className = 'range-info set';
      el.textContent = calMonth + '月' + startDay + '日 〜 ' + calMonth + '月' + endDay + '日（' + (endDay - startDay + 1) + '日間）';
    } else if (startDay) {
      el.className = 'range-info set';
      el.textContent = calMonth + '月' + startDay + '日 → 終了日をタップ（1日だけならもう一度同じ日）';
    } else {
      el.className = 'range-info';
      el.textContent = '開始日をタップ';
    }
  }

  // ===== 送信バーのサマリー =====
  function updateSummary() {
    var parts = [];
    if (sel.name) parts.push(sel.name);
    if (sel.torihiki) parts.push(sel.torihiki);
    if (sel.carrier) parts.push(sel.carrier);
    if (startDay) parts.push(calMonth + '/' + startDay + (endDay && endDay !== startDay ? '〜' + endDay : ''));
    var place = document.getElementById('place').value;
    if (place) parts.push(place);
    document.getElementById('summary').textContent = parts.join(' ｜ ');
  }

  // ===== 送信 =====
  function submitForm() {
    var resultEl = document.getElementById('result');
    var btn = document.getElementById('btn-submit');
    var data = {
      name: sel.name,
      torihiki: sel.torihiki,
      carrier: sel.carrier,
      startDay: startDay,
      endDay: endDay || startDay,
      place: document.getElementById('place').value,
      hotel: document.getElementById('hotel').value,
      year: calYear,
      month: calMonth
    };
    if (!data.name) { showError('名前を選択してください'); return; }
    if (!data.torihiki) { showError('取引先を選択してください'); return; }
    if (!data.carrier) { showError('キャリアを選択してください'); return; }
    if (!startDay) { showError('期間を選択してください'); return; }
    if (!data.place) { showError('開催場所を入力してください'); return; }

    resultEl.className = '';
    resultEl.textContent = '送信中...';
    btn.disabled = true;

    callApi('submitShift', { data: data })
      .then(function() {
        resultEl.className = 'success';
        resultEl.textContent = '✅ 送信完了しました！';
        btn.disabled = false;
        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

        startDay = null; endDay = null;
        document.getElementById('place').value = '';
        document.getElementById('hotel').value = '';
        renderCal();
        updateSummary();
        updateProgress();

        editMode = false;
        document.getElementById('edit-banner').classList.remove('show');

        scrollToStep('date');

        setTimeout(function() { resultEl.textContent = ''; }, 3000);
      })
      .catch(function(err) {
        showError(err.message);
        btn.disabled = false;
      });

    function showError(msg) {
      resultEl.className = 'error-msg';
      resultEl.textContent = '⚠️ ' + msg;
      if (navigator.vibrate) navigator.vibrate(80);
    }
  }

  // ===== 確認・修正 =====
  function loadMyShifts() {
    var listEl = document.getElementById('shift-list');
    if (!confirmName) { listEl.innerHTML = ''; return; }
    listEl.innerHTML = '<div class="loading-msg">読み込み中...</div>';
    callApi('getMyShifts', { name: confirmName })
      .then(function(shifts) { renderShiftList(shifts); })
      .catch(function(err) {
        listEl.innerHTML = '<div class="empty-msg">❌ 読み込みエラー: ' + err.message + '<br><button class="btn-submit" style="margin-top:10px;max-width:200px;padding:10px;font-size:13px;" onclick="loadMyShifts()">再試行</button></div>';
      });
  }

  var loadedShifts = [];
  function renderShiftList(shifts) {
    loadedShifts = shifts || [];
    var listEl = document.getElementById('shift-list');
    if (loadedShifts.length === 0) {
      listEl.innerHTML = '<div class="empty-msg">入力済みのシフトはありません</div>';
      return;
    }
    var html = '';
    loadedShifts.forEach(function(s, i) {
      var dateStr = s.month + '月' + s.startDay + '日';
      if (s.startDay !== s.endDay) dateStr += ' 〜 ' + s.month + '月' + s.endDay + '日';
      html += '<div class="shift-item">';
      html += '<div class="date-label">📅 ' + dateStr + '</div>';
      html += '<div class="detail"><span>取引先</span>' + s.torihiki + '</div>';
      html += '<div class="detail"><span>キャリア</span>' + s.carrier + '</div>';
      html += '<div class="detail"><span>開催場所</span>' + s.place + '</div>';
      if (s.hotel) html += '<div class="detail"><span>ホテル</span>' + s.hotel + '</div>';
      html += '<div class="shift-actions">';
      html += '<button class="btn-edit" onclick="editShift(' + i + ')">✏️ 修正</button>';
      html += '<button class="btn-delete" onclick="deleteShift(' + i + ')">🗑 削除</button>';
      html += '</div></div>';
    });
    listEl.innerHTML = html;
  }

  function editShift(i) {
    var shift = loadedShifts[i];
    switchTab('input');

    sel.name = confirmName;
    sel.torihiki = shift.torihiki;
    sel.carrier = shift.carrier;
    selectChip('chips-name', confirmName);
    selectChip('chips-torihiki', shift.torihiki);
    selectChip('chips-carrier', shift.carrier);
    document.getElementById('place').value = shift.place;
    document.getElementById('hotel').value = shift.hotel || '';
    calYear = shift.year;
    calMonth = shift.month;
    startDay = shift.startDay;
    endDay = shift.endDay;
    renderCal();
    updateSummary();
    updateProgress();

    editMode = true;
    document.getElementById('edit-banner').classList.add('show');

    var resultEl = document.getElementById('result');
    resultEl.className = '';
    resultEl.textContent = '✏️ 修正モード：変更して送信してください';
    window.scrollTo(0, 0);
  }

  function deleteShift(i) {
    var s = loadedShifts[i];
    if (!confirm(confirmName + ' の ' + s.month + '月' + s.startDay + '日〜' + s.endDay + '日 を削除しますか？')) return;
    callApi('deleteShift', { name: confirmName, startDay: s.startDay, endDay: s.endDay })
      .then(function() { loadMyShifts(); })
      .catch(function(err) { alert('削除エラー: ' + err.message); });
  }
</script>
</body>
</html>
