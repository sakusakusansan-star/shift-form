<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト入力</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #EEF2F6; min-height: 100vh;
      padding: 10px 10px 110px;
      color: #26323D;
    }

    /* ===== タブ ===== */
    .tabs { display: flex; background: #fff; border-radius: 14px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
    .tab { flex: 1; padding: 15px 8px; text-align: center; font-size: 15px; font-weight: 700; color: #97A3AE; border-bottom: 3px solid transparent; }
    .tab.active { color: #2D5F8A; border-bottom-color: #2D5F8A; }

    /* ===== 進捗バー ===== */
    .progress-wrap { background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
    .progress-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #6B7986; margin-bottom: 8px; }
    .progress-label b { color: #2D5F8A; }
    .progress-track { height: 8px; background: #EEF2F6; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #2D5F8A, #4A90D9); border-radius: 99px; width: 0%; transition: width .3s ease; }

    .edit-banner {
      display: none; align-items: center; gap: 8px;
      background: #FFF6E5; border: 1.5px solid #F5C860; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #8A6416;
    }
    .edit-banner.show { display: flex; }
    .edit-banner .banner-text { flex: 1; }
    .btn-cancel-edit {
      border: 1.5px solid #C79A2E; background: #fff; color: #8A6416; border-radius: 8px;
      padding: 8px 12px; font-size: 12.5px; font-weight: 700; flex-shrink: 0;
    }

    /* ===== カード ===== */
    .card {
      background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,.07); transition: box-shadow .2s ease, border-color .2s ease;
      border: 2px solid transparent; scroll-margin-top: 12px;
    }
    .card.done { border-color: #C8E6C9; }
    .card-label {
      font-size: 13px; font-weight: 700; color: #6B7986; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px; min-height: 30px;
    }
    /* 完了したステップは1行にたたむ */
    .card.collapsed { padding: 10px 14px; }
    .card.collapsed .card-label { margin-bottom: 0; cursor: pointer; }
    .card.collapsed .chips, .card.collapsed .auto-badge { display: none !important; }
    .step-change {
      display: none; flex-shrink: 0; border: 1.5px solid #DDE4EA; background: #fff; color: #2D5F8A;
      border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700;
    }
    .card.collapsed .step-change { display: inline-block; }
    /* 未入力の項目へ移動したときの目印 */
    @keyframes attention {
      0%, 100% { border-color: transparent; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
      25%, 75% { border-color: #F5A623; box-shadow: 0 0 0 4px rgba(245,166,35,.22); }
    }
    .card.attention { animation: attention 1.3s ease; }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; background: #2D5F8A; color: #fff;
      font-size: 12px; font-weight: 700; flex-shrink: 0; transition: background .2s ease;
    }
    .card.done .step-num { background: #2E7D32; }
    .step-label-text { flex-shrink: 0; }
    .step-done-summary {
      font-size: 12.5px; font-weight: 700; color: #2E7D32;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right;
    }
    .step-done-summary.partial { color: #2D5F8A; }

    /* ===== チップボタン（選択式）===== */
    .chips { display: grid; gap: 8px; }
    .chips.cols3 { grid-template-columns: repeat(3, 1fr); }
    .chips.cols4 { grid-template-columns: repeat(4, 1fr); }
    .chips.cols2 { grid-template-columns: repeat(2, 1fr); }
    .chip {
      padding: 15px 4px; border: 2px solid #DDE4EA; border-radius: 12px;
      background: #FAFBFC; text-align: center; font-size: 15px; font-weight: 700;
      color: #4A5865; min-height: 54px; display: flex; align-items: center; justify-content: center;
      transition: transform .05s;
    }
    .chip:active { transform: scale(.95); }
    .chip.selected { border-color: #2D5F8A; background: #2D5F8A; color: #fff; }

    .auto-badge { background: #E8F5E9; color: #2E7D32; border-radius: 6px; font-size: 11px; padding: 2px 8px; font-weight: 700; }

    /* ===== テキスト入力 ===== */
    input[type="text"] {
      width: 100%; padding: 15px 14px; border: 2px solid #DDE4EA; border-radius: 12px;
      font-size: 16px; background: #FAFBFC; color: #26323D;
    }
    input[type="text"]:focus { outline: none; border-color: #2D5F8A; background: #fff; }
    .input-gap { margin-top: 12px; }
    .field-label { font-size: 13px; font-weight: 700; color: #6B7986; margin-bottom: 8px; }
    .quick-places { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .qp {
      padding: 8px 12px; border-radius: 20px; border: 1px solid #DDE4EA;
      background: #fff; font-size: 13px; color: #4A5865; font-weight: 600;
    }
    .qp:active { background: #EEF2F6; }

    /* ===== カレンダー ===== */
    .cal-header { display: flex; align-items: center; justify-content: center; margin-bottom: 12px; min-height: 24px; }
    .cal-title { font-size: 17px; font-weight: 800; color: #2D5F8A; }
    .cal-dow-grid, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 11px; color: #97A3AE; padding: 4px 0; font-weight: 700; }
    .cal-dow.sat { color: #1565C0; } .cal-dow.sun { color: #C62828; }
    .cal-day {
      text-align: center; font-size: 17px; font-weight: 600; border-radius: 10px;
      color: #26323D; min-height: 50px; display: flex; align-items: center; justify-content: center;
    }
    .cal-day:active { opacity: .6; }
    .cal-day.sat { color: #1565C0; } .cal-day.sun { color: #C62828; }
    .cal-day.start, .cal-day.end { background: #2D5F8A !important; color: #fff !important; font-weight: 800; }
    .cal-day.in-range { background: #C6DCF2; color: #0C447C; border-radius: 0; }
    .cal-day.empty { pointer-events: none; }
    .cal-day { flex-direction: column; gap: 3px; }
    .cal-mark { width: 70%; height: 5px; border-radius: 3px; }
    .cal-mark.editing { opacity: .35; }
    .cal-day.start .cal-mark, .cal-day.end .cal-mark { box-shadow: 0 0 0 1.5px #fff; }
    .cal-day.conflict { background: #FDE2E2; color: #B71C1C; }
    .cal-day.conflict.start, .cal-day.conflict.end { box-shadow: inset 0 0 0 3px #E53935; }
    .cal-status { grid-column: 1 / -1; text-align: center; color: #97A3AE; font-size: 14px; font-weight: 700; padding: 28px 0; }
    .range-info.warn { color: #C62828; }
    .booked-list { margin-top: 12px; border-top: 1px dashed #E3E9EE; padding-top: 10px; font-size: 13px; }
    .booked-head { font-weight: 700; color: #6B7986; margin-bottom: 4px; }
    .booked-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: #26323D; font-weight: 600; }
    .booked-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .booked-note { color: #97A3AE; font-weight: 600; padding: 4px 0; }
    .btn-retry { margin-left: 8px; padding: 6px 12px; border: 1.5px solid #2D5F8A; border-radius: 8px; background: #fff; color: #2D5F8A; font-size: 13px; font-weight: 700; }
    .range-info { text-align: center; margin-top: 10px; font-size: 14px; font-weight: 700; color: #97A3AE; min-height: 20px; }
    .range-info.set { color: #2D5F8A; }

    /* ===== スティッキー送信バー ===== */
    .submit-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: rgba(255,255,255,.97); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 12px rgba(0,0,0,.1);
    }
    .summary {
      font-size: 12px; color: #6B7986; margin-bottom: 8px; text-align: center; font-weight: 600;
      height: 15px; line-height: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-submit {
      width: 100%; padding: 0 16px; background: #2D5F8A; color: #fff; border: none;
      border-radius: 12px; font-size: 17px; font-weight: 800; height: 54px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      overflow: hidden; white-space: nowrap; transition: background .2s ease, color .2s ease;
    }
    .btn-submit:active { background: #1a4a6e; transform: scale(.98); }
    .btn-submit.pending { background: #E4ECF3; color: #2D5F8A; font-size: 15px; }
    .btn-submit.pending:active { background: #D5E1EC; }
    .btn-submit:disabled { background: #5A80A3; transform: none; }
    .spinner {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
      border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== トースト ===== */
    .toast {
      position: fixed; left: 16px; right: 16px; bottom: calc(108px + env(safe-area-inset-bottom));
      max-width: 440px; margin: 0 auto; z-index: 90;
      background: #26323D; color: #fff; border-radius: 12px; padding: 12px 16px;
      font-size: 14px; font-weight: 700; text-align: center; line-height: 1.5;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
      opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: #C62828; }
    body.no-bar .toast { bottom: calc(20px + env(safe-area-inset-bottom)); }

    /* ===== ダイアログ（下から出るシート）===== */
    .overlay {
      position: fixed; inset: 0; z-index: 100; background: rgba(20,30,40,.45);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; transition: opacity .2s ease;
    }
    .overlay.show { opacity: 1; }
    .sheet {
      background: #fff; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
      border-radius: 20px 20px 0 0; padding: 24px 18px calc(18px + env(safe-area-inset-bottom));
      transform: translateY(32px); transition: transform .22s ease; outline: none;
    }
    .overlay.show .sheet { transform: none; }
    .sheet-icon {
      width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-icon.check { background: #E8F5E9; color: #2E7D32; }
    .sheet-icon.warn { background: #FFF3E0; color: #E65100; }
    .sheet-icon.trash { background: #FDECEC; color: #C62828; }
    .sheet-icon svg { width: 30px; height: 30px; }
    .sheet-title { font-size: 19px; font-weight: 800; text-align: center; color: #26323D; }
    .sheet-text { font-size: 14px; color: #4A5865; line-height: 1.6; margin-top: 6px; text-align: center; }
    .sheet-body { margin-top: 16px; }
    .sheet-actions { display: grid; gap: 8px; margin-top: 20px; }
    .btn { min-height: 52px; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: #2D5F8A; color: #fff; }
    .btn-danger { background: #D32F2F; color: #fff; }
    .btn-ghost { background: #EEF2F6; color: #4A5865; }

    .conf-list { display: grid; gap: 6px; }
    .conf-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 12px;
      background: #FDECEC; border-radius: 10px; color: #B71C1C; font-size: 14px; font-weight: 700;
    }
    .sum-card { background: #F6F8FA; border-left: 5px solid #78909C; border-radius: 12px; padding: 12px 14px; }
    .sum-date { font-size: 17px; font-weight: 800; color: #2D5F8A; margin-bottom: 6px; }
    .sum-row { display: flex; gap: 10px; font-size: 14px; font-weight: 600; padding: 2px 0; }
    .sum-row span:first-child { color: #97A3AE; font-size: 12px; width: 56px; flex-shrink: 0; padding-top: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .overlay, .sheet, .toast, .btn-submit { transition: none; }
      .card.attention { animation: none; border-color: #F5A623; }
    }

    /* ===== 確認タブ ===== */
    .shift-item { border: 1px solid #E3E9EE; border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #FAFBFC; }
    .shift-item .date-label { font-size: 16px; font-weight: 800; color: #2D5F8A; margin-bottom: 6px; }
    .shift-item .detail { font-size: 14px; margin-bottom: 3px; }
    .shift-item .detail span { color: #97A3AE; font-size: 12px; margin-right: 6px; }
    .shift-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-edit, .btn-delete { flex: 1; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; background: #fff; min-height: 48px; }
    .btn-edit { border: 2px solid #2D5F8A; color: #2D5F8A; }
    .btn-delete { border: 2px solid #E53935; color: #E53935; }
    .empty-msg, .loading-msg { text-align: center; color: #AAB4BD; font-size: 14px; padding: 30px 0; }

    .page { display: none; }
    .page.active { display: block; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>

  <div class="tabs">
    <div class="tab active" id="tab-input" onclick="switchTab('input')">入力</div>
    <div class="tab" id="tab-confirm" onclick="switchTab('confirm')">確認・修正</div>
  </div>

  <!-- ===== 入力タブ ===== -->
  <div id="page-input" class="page active">

    <div class="progress-wrap">
      <div class="progress-label"><span>入力の進み具合</span><span><b id="progress-count">0</b>/<span id="progress-total">5</span> 完了</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="edit-banner" id="edit-banner">
      <span class="banner-text">✏️ 修正モード：内容を変更して送信してください</span>
      <button class="btn-cancel-edit" onclick="cancelEdit()">キャンセル</button>
    </div>

    <div class="card" id="step-name">
      <div class="card-label">
        <span class="step-num" id="stepnum-name">1</span>
        <span class="step-label-text">名前</span>
        <span class="step-done-summary" id="stepsum-name"></span>
        <button type="button" class="step-change" aria-label="名前を変更">変更</button>
      </div>
      <div class="chips cols3" id="chips-name">
        <button class="chip" data-value="山口">山口</button>
        <button class="chip" data-value="鈴木">鈴木</button>
        <button class="chip" data-value="毛利">毛利</button>
        <button class="chip" data-value="山内">山内</button>
      </div>
    </div>

    <div class="card" id="step-torihiki">
      <div class="card-label">
        <span class="step-num" id="stepnum-torihiki">2</span>
        <span class="step-label-text">取引先</span>
        <span class="step-done-summary" id="stepsum-torihiki"></span>
        <button type="button" class="step-change" aria-label="取引先を変更">変更</button>
      </div>
      <div class="chips cols2" id="chips-torihiki">
        <button class="chip" data-value="南国殖産">南国殖産</button>
        <button class="chip" data-value="ハイコム">ハイコム</button>
        <button class="chip" data-value="サンコミ">サンコミ</button>
        <button class="chip" data-value="ダル">ダル</button>
        <button class="chip" data-value="NOON">NOON</button>
        <button class="chip" data-value="九情">九情</button>
      </div>
    </div>

    <div class="card" id="step-carrier">
      <div class="card-label">
        <span class="step-num" id="stepnum-carrier">3</span>
        <span class="step-label-text">キャリア</span>
        <span class="auto-badge" id="auto-badge" style="display:none;">自動選択</span>
        <span class="step-done-summary" id="stepsum-carrier"></span>
        <button type="button" class="step-change" aria-label="キャリアを変更">変更</button>
      </div>
      <div class="chips cols3" id="chips-carrier">
        <button class="chip" data-value="docomo">docomo</button>
        <button class="chip" data-value="au">au</button>
        <button class="chip" data-value="SoftBank">SoftBank</button>
      </div>
    </div>

    <div class="card" id="step-date">
      <div class="card-label">
        <span class="step-num" id="stepnum-date">4</span>
        <span class="step-label-text">期間（開始日 → 終了日の順にタップ）</span>
        <span class="step-done-summary" id="stepsum-date"></span>
      </div>
      <div class="cal-header">
        <span class="cal-title" id="calTitle"></span>
      </div>
      <div class="cal-dow-grid">
        <div class="cal-dow">月</div><div class="cal-dow">火</div><div class="cal-dow">水</div>
        <div class="cal-dow">木</div><div class="cal-dow">金</div>
        <div class="cal-dow sat">土</div><div class="cal-dow sun">日</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="range-info" id="rangeInfo"></div>
      <div class="booked-list" id="bookedList" style="display:none;"></div>
    </div>

    <div class="card" id="step-place">
      <div class="card-label">
        <span class="step-num" id="stepnum-place">5</span>
        <span class="step-label-text">開催場所</span>
        <span class="step-done-summary" id="stepsum-place"></span>
      </div>
      <input type="text" id="place" placeholder="例: 下通、ゆめタウン博多" oninput="onPlaceInput()">
      <div class="quick-places" id="quick-places"></div>
      <div class="input-gap">
        <div class="field-label">ホテル（任意）</div>
        <input type="text" id="hotel" placeholder="宿泊先ホテル名" oninput="onPlaceInput()">
      </div>
    </div>

  </div>

  <!-- ===== 確認・修正タブ ===== -->
  <div id="page-confirm" class="page">
    <div class="card">
      <div class="card-label" style="justify-content:flex-start;">名前を選択</div>
      <div class="chips cols3" id="chips-confirm-name">
        <button class="chip" data-value="山口">山口</button>
        <button class="chip" data-value="鈴木">鈴木</button>
        <button class="chip" data-value="毛利">毛利</button>
        <button class="chip" data-value="山内">山内</button>
      </div>
    </div>
    <div id="shift-list"></div>
  </div>

  <!-- ===== スティッキー送信バー ===== -->
  <div class="submit-bar" id="submit-bar">
    <div class="summary" id="summary"></div>
    <button class="btn-submit" id="btn-submit" onclick="submitForm()">送信する</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ▼▼▼ GASのWebアプリURL（/execで終わるもの） ▼▼▼
  var GAS_URL = "https://script.google.com/macros/s/AKfycbwx4-wjr4Qmx6zeXDXZhht-65W7veveJvaXXmC9V5MQLipOLxLoWfz-XEUBau8NZ58h/exec";

  var calYear, calMonth, startDay = null, endDay = null;
  var sel = { name: '', torihiki: '', carrier: '' };
  var confirmName = '';
  var carrierAutoSet = false;
  var editMode = false;
  // 修正モードのとき、どのレコードを書き換えるのかを保持する。
  // これを送らないとGAS側が元の行を特定できず、新規追加になってしまう。
  var editOriginal = null;

  // カレンダーはシフト表（GAS）の月に固定する。読み込むまで日付は押せない。
  var monthLoaded = false, monthError = '';
  // 選択中の名前の登録済み予定（getMyShifts の結果）。入力タブと確認タブで共有する。
  var shiftCache = { name: null, list: null, error: null, promise: null };

  var NAME_KEY = 'shiftform.name';
  var TORIHIKI_COLORS = {
    '南国殖産': '#2E7D32', 'ハイコム': '#E65100', 'サンコミ': '#6A1B9A',
    'ダル': '#00838F', 'NOON': '#AD1457', '九情': '#1565C0'
  };

  // 名前の正規リスト（チップの data-value が唯一の定義元）
  var VALID_NAMES = Array.prototype.map.call(
    document.querySelectorAll('#chips-name .chip'),
    function(b) { return b.dataset.value; }
  );

  var urlParams = new URLSearchParams(window.location.search);
  // URLで渡された名前はリストに載っている場合のみ採用する。
  // 載っていない（削除された等）ときは通常の名前選択にフォールバックする。
  var staffParam = urlParams.get('staff');
  var staffFromUrl = (staffParam && VALID_NAMES.indexOf(staffParam) !== -1) ? staffParam : null;

  var stepOrder = staffFromUrl
    ? ['torihiki', 'carrier', 'date', 'place']
    : ['name', 'torihiki', 'carrier', 'date', 'place'];

  var QUICK_PLACES = ['下通', 'ゆめタウン博多', 'ゆめタウン光の森', 'イオンモール熊本'];

  var STEP_LABELS = { name: '名前', torihiki: '取引先', carrier: 'キャリア', date: '期間', place: '開催場所' };
  // 選び終わったら1行にたたむステップ。expanded[id] が true の間は開いたままにする。
  var COLLAPSIBLE = { name: true, torihiki: true, carrier: true };
  var expanded = {};
  var submitting = false;

  // ── GASとの通信（共通関数）タイムアウト付き ─────────────────────────
  function callApi(action, params, timeoutMs) {
    timeoutMs = timeoutMs || 15000;
    var body = Object.assign({ action: action }, params || {});

    return new Promise(function(resolve, reject) {
      var timedOut = false;
      var timer = setTimeout(function() {
        timedOut = true;
        reject(new Error('通信がタイムアウトしました（' + (timeoutMs/1000) + '秒）。電波状況を確認して再試行してください。'));
      }, timeoutMs);

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(body)
      })
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (timedOut) return;
          clearTimeout(timer);
          if (!json.ok) {
            reject(new Error(json.error || '不明なエラー'));
          } else {
            resolve(json.data);
          }
        })
        .catch(function(err) {
          if (timedOut) return;
          clearTimeout(timer);
          reject(new Error('通信エラー: ' + err.message));
        });
    });
  }

  // ── シフト表の月を読み込む ──────────────────────────────
  // GASが書き込めるのはシフト表の月だけなので、カレンダーもその月に固定する。
  // 読み込みが終わるまでは日付を押せないようにして、未確定の月で送られるのを防ぐ。
  function loadMonth() {
    monthError = '';
    renderCal();
    callApi('getMonthInfo')
      .then(function(info) {
        // "2026" や "9月" のような文字列でも受け付ける。
        var y = parseInt(info && info.year, 10);
        var m = parseInt(info && info.month, 10);
        if (!y || !(m >= 1 && m <= 12)) throw new Error('シフト表の年月（A1・B1）を読み取れませんでした');
        calYear = y;
        calMonth = m;
        monthLoaded = true;
        renderCal();
        updateSummary();
        updateProgress();
      })
      .catch(function(err) {
        monthError = err.message;
        renderCal();
      });
  }

  // ── 登録済みの予定を読み込む ────────────────────────────
  // force=false なら読み込み済みの結果を使い回す。読み込み中なら同じ通信を待つ。
  function fetchMyShifts(name, force) {
    if (shiftCache.name === name) {
      if (shiftCache.promise) return shiftCache.promise;
      if (!force && shiftCache.list) return Promise.resolve(shiftCache.list);
    }
    var p = callApi('getMyShifts', { name: name }).then(function(list) {
      if (shiftCache.promise === p) {
        shiftCache.list = list || [];
        shiftCache.promise = null;
        onShiftsUpdated();
      }
      return list || [];
    }, function(err) {
      if (shiftCache.promise === p) {
        shiftCache.error = err;
        shiftCache.promise = null;
        onShiftsUpdated();
      }
      throw err;
    });
    shiftCache = { name: name, list: null, error: null, promise: p };
    onShiftsUpdated();
    return p;
  }

  function onShiftsUpdated() {
    renderCal();
  }

  // 表示中の月の予定（今の名前の分だけ）
  function monthShifts() {
    if (!monthLoaded || !shiftCache.list || shiftCache.name !== sel.name) return [];
    return shiftCache.list.filter(function(s) {
      return Number(s.year) === calYear && Number(s.month) === calMonth;
    });
  }

  // 修正中の予定そのもの。GAS側で先に消してから書くので、重複扱いにしない。
  function isEditingShift(s) {
    return !!(editMode && editOriginal &&
      Number(s.startDay) === Number(editOriginal.startDay) &&
      Number(s.endDay) === Number(editOriginal.endDay) &&
      s.torihiki === editOriginal.torihiki);
  }

  function bookedByDay() {
    var map = {};
    monthShifts().forEach(function(s) {
      for (var d = Number(s.startDay); d <= Number(s.endDay); d++) map[d] = s;
    });
    return map;
  }

  // from〜to のうち、既に別の予定が入っている日
  function findConflicts(from, to) {
    var booked = bookedByDay(), out = [];
    for (var d = from; d <= to; d++) {
      if (booked[d] && !isEditingShift(booked[d])) out.push({ day: d, shift: booked[d] });
    }
    return out;
  }

  // 連続した同じ予定はまとめて「6〜7日 南国殖産（下通）」の形にする
  function groupConflicts(conf) {
    var groups = [];
    conf.forEach(function(c) {
      var g = groups[groups.length - 1];
      if (g && g.shift === c.shift && g.to === c.day - 1) g.to = c.day;
      else groups.push({ shift: c.shift, from: c.day, to: c.day });
    });
    return groups;
  }
  function describeConflictGroup(g) {
    return (g.from === g.to ? g.from + '日' : g.from + '〜' + g.to + '日') + ' ' +
      g.shift.torihiki + (g.shift.place ? '（' + g.shift.place + '）' : '');
  }
  function describeConflicts(conf) {
    return groupConflicts(conf).map(describeConflictGroup);
  }

  function torihikiColor(t) {
    return TORIHIKI_COLORS[t] || '#78909C';
  }

  // ── 名前（入力タブと確認タブで共通。次回のために端末に覚える）──
  function loadSavedName() {
    try {
      var v = localStorage.getItem(NAME_KEY);
      return (v && VALID_NAMES.indexOf(v) !== -1) ? v : null;
    } catch (e) { return null; }
  }
  function saveName(v) {
    try { localStorage.setItem(NAME_KEY, v); } catch (e) {}
  }
  function setName(v) {
    sel.name = v;
    confirmName = v;
    selectChip('chips-name', v);
    selectChip('chips-confirm-name', v);
    if (!staffFromUrl) saveName(v);
    fetchMyShifts(v);
    updateSummary();
    updateProgress();
  }

  // ===== チップ選択のセットアップ =====
  function setupChips(containerId, key, onChange) {
    var container = document.getElementById(containerId);
    container.querySelectorAll('.chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        container.querySelectorAll('.chip').forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        if (key) sel[key] = btn.dataset.value;
        if (onChange) onChange(btn.dataset.value);
        updateSummary();
        if (navigator.vibrate) navigator.vibrate(10);
      });
    });
  }

  // 選んだチップを一瞬見せてからたたみ、次の未入力ステップへ進む
  function collapseAfterChoose(id) {
    expanded[id] = true;
    setTimeout(function() {
      expanded[id] = false;
      updateProgress();
      if (!editMode) scrollToNextAfter(id);
    }, 200);
  }

  setupChips('chips-name', 'name', function(v) {
    collapseAfterChoose('name');
    setName(v);
  });
  setupChips('chips-torihiki', 'torihiki', function(v) {
    var auto = { 'ハイコム': 'SoftBank', 'サンコミ': 'au', '九情': 'au' };
    var badge = document.getElementById('auto-badge');
    if (auto[v]) {
      selectChip('chips-carrier', auto[v]);
      sel.carrier = auto[v];
      carrierAutoSet = true;
      badge.style.display = 'inline-block';
    } else {
      if (carrierAutoSet) { clearChips('chips-carrier'); sel.carrier = ''; carrierAutoSet = false; }
      badge.style.display = 'none';
    }
    collapseAfterChoose('torihiki');
    updateSummary();
    updateProgress();
  });
  setupChips('chips-carrier', 'carrier', function() {
    carrierAutoSet = false;
    document.getElementById('auto-badge').style.display = 'none';
    collapseAfterChoose('carrier');
    updateProgress();
  });

  // たたんだステップは見出しか「変更」を押すと開く
  Object.keys(COLLAPSIBLE).forEach(function(id) {
    var card = document.getElementById('step-' + id);
    card.querySelector('.card-label').addEventListener('click', function() {
      if (!card.classList.contains('collapsed')) return;
      expanded[id] = true;
      updateProgress();
    });
  });
  setupChips('chips-confirm-name', null, function(v) {
    setName(v);
    loadMyShifts();
  });

  function selectChip(containerId, value) {
    var container = document.getElementById(containerId);
    container.querySelectorAll('.chip').forEach(function(b) {
      b.classList.toggle('selected', b.dataset.value === value);
    });
  }
  function clearChips(containerId) {
    document.getElementById(containerId).querySelectorAll('.chip').forEach(function(b) { b.classList.remove('selected'); });
  }

  // ===== よく使う場所 =====
  (function() {
    var wrap = document.getElementById('quick-places');
    QUICK_PLACES.forEach(function(p) {
      var b = document.createElement('button');
      b.className = 'qp';
      b.textContent = p;
      b.onclick = function() {
        document.getElementById('place').value = p;
        onPlaceInput();
        if (navigator.vibrate) navigator.vibrate(10);
      };
      wrap.appendChild(b);
    });
  })();

  function onPlaceInput() {
    updateSummary();
    updateProgress();
  }

  // ===== 進捗・完了マーク =====
  function isStepComplete(id) {
    if (id === 'name')     return !!sel.name;
    if (id === 'torihiki') return !!sel.torihiki;
    if (id === 'carrier')  return !!sel.carrier;
    if (id === 'date')     return !!(startDay && endDay);
    if (id === 'place')    return !!document.getElementById('place').value;
    return false;
  }

  // 見出しの右に出す選択内容（完了の印は番号の ✓ で示す）
  function getSummaryText(id) {
    if (id === 'name')     return sel.name;
    if (id === 'torihiki') return sel.torihiki;
    if (id === 'carrier')  return sel.carrier ? (sel.carrier + (carrierAutoSet ? '（自動）' : '')) : '';
    if (id === 'date') {
      if (!startDay) return '';
      return calMonth + '月' + startDay + '日' + (endDay && endDay !== startDay ? '〜' + endDay + '日' : '');
    }
    if (id === 'place') {
      var p = document.getElementById('place').value;
      if (!p) return '';
      var h = document.getElementById('hotel').value;
      return h ? (p + '（' + h + '）') : p;
    }
    return '';
  }

  function isCollapsed(id) {
    return !!COLLAPSIBLE[id] && isStepComplete(id) && !expanded[id];
  }

  function missingSteps() {
    return stepOrder.filter(function(id) { return !isStepComplete(id); });
  }

  function updateProgress() {
    var completedCount = 0;
    stepOrder.forEach(function(id) {
      var card = document.getElementById('step-' + id);
      var complete = isStepComplete(id);
      if (complete) completedCount++;
      if (card) {
        card.classList.toggle('done', complete);
        card.classList.toggle('collapsed', isCollapsed(id));
        var changeBtn = card.querySelector('.step-change');
        if (changeBtn) changeBtn.setAttribute('aria-expanded', String(!isCollapsed(id)));
      }
      var numEl = document.getElementById('stepnum-' + id);
      if (numEl) numEl.textContent = complete ? '✓' : numEl.getAttribute('data-num');
      var sumEl = document.getElementById('stepsum-' + id);
      if (sumEl) {
        sumEl.textContent = getSummaryText(id);
        sumEl.classList.toggle('partial', !complete);
      }
    });
    document.getElementById('progress-count').textContent = completedCount;
    document.getElementById('progress-total').textContent = stepOrder.length;
    var pct = Math.round((completedCount / stepOrder.length) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    updateSubmitButton();
  }

  // 送信ボタンに「あと何が足りないか」を出す。押すとその項目へ移動する。
  function updateSubmitButton() {
    if (submitting) return;
    var btn = document.getElementById('btn-submit');
    var miss = missingSteps();
    btn.disabled = false;
    btn.classList.toggle('pending', miss.length > 0);
    if (miss.length) {
      // 4項目以上はボタンに収まらないので先頭2つだけ出す
      var labels = miss.map(function(id) { return STEP_LABELS[id]; });
      btn.textContent = 'あと' + miss.length + '項目：' +
        (labels.length > 3 ? labels.slice(0, 2).join('・') + ' ほか' : labels.join('・'));
    } else {
      btn.textContent = editMode ? '修正を送信する' : 'この内容で送信する';
    }
  }

  // label を渡すと処理中表示（スピナー付き）、false で通常に戻す
  function setSubmitting(label) {
    var btn = document.getElementById('btn-submit');
    submitting = !!label;
    if (!label) { updateSubmitButton(); return; }
    btn.disabled = true;
    btn.classList.remove('pending');
    btn.innerHTML = '';
    var sp = document.createElement('span');
    sp.className = 'spinner';
    btn.appendChild(sp);
    btn.appendChild(document.createTextNode(label));
  }

  // 未入力のステップへ移動して目立たせる
  function focusStep(id) {
    var card = document.getElementById('step-' + id);
    if (!card) return;
    scrollToStep(id);
    card.classList.remove('attention');
    void card.offsetWidth; // アニメーションをやり直すため
    card.classList.add('attention');
    setTimeout(function() { card.classList.remove('attention'); }, 1400);
    if (navigator.vibrate) navigator.vibrate(30);
    if (id === 'place') {
      setTimeout(function() { document.getElementById('place').focus({ preventScroll: true }); }, 450);
    }
  }

  document.querySelectorAll('.step-num').forEach(function(el) {
    el.setAttribute('data-num', el.textContent);
  });

  function scrollToStep(id) {
    var el = document.getElementById('step-' + id);
    if (!el) return;
    setTimeout(function() {
      var y = el.getBoundingClientRect().top + window.pageYOffset - 10;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }, 120);
  }

  function scrollToNextAfter(id) {
    var idx = stepOrder.indexOf(id);
    for (var i = idx + 1; i < stepOrder.length; i++) {
      if (!isStepComplete(stepOrder[i])) {
        scrollToStep(stepOrder[i]);
        return;
      }
    }
  }

  updateProgress();

  // ===== 起動時の処理 =====
  // URLの ?staff= があればそれを使い、無ければ前回選んだ名前を復元する。
  if (staffFromUrl) {
    document.getElementById('step-name').style.display = 'none';
    setName(staffFromUrl);
  } else {
    var savedName = loadSavedName();
    if (savedName) setName(savedName);
  }
  loadMonth();

  // ===== タブ切替 =====
  function switchTab(tab) {
    document.getElementById('tab-input').classList.toggle('active', tab === 'input');
    document.getElementById('tab-confirm').classList.toggle('active', tab === 'confirm');
    document.getElementById('page-input').classList.toggle('active', tab === 'input');
    document.getElementById('page-confirm').classList.toggle('active', tab === 'confirm');
    document.getElementById('submit-bar').style.display = (tab === 'input') ? 'block' : 'none';
    document.body.classList.toggle('no-bar', tab !== 'input');
    if (tab === 'confirm') { exitEditMode(); loadMyShifts(); }
  }

  // ===== カレンダー =====
  function renderCal() {
    var grid = document.getElementById('calGrid');
    var title = document.getElementById('calTitle');
    grid.innerHTML = '';

    if (!monthLoaded) {
      title.textContent = '';
      var st = document.createElement('div');
      st.className = 'cal-status';
      if (monthError) {
        st.textContent = '⚠️ 読み込みエラー: ' + monthError;
        var retry = document.createElement('button');
        retry.className = 'btn-retry';
        retry.textContent = '再試行';
        retry.onclick = loadMonth;
        st.appendChild(document.createElement('br'));
        st.appendChild(retry);
      } else {
        st.textContent = 'シフト表を読み込み中…';
      }
      grid.appendChild(st);
      document.getElementById('rangeInfo').textContent = '';
      renderBookedList();
      return;
    }

    title.textContent = calYear + '年' + calMonth + '月';
    var firstWd = new Date(calYear, calMonth - 1, 1).getDay();
    var offset = (firstWd === 0) ? 6 : firstWd - 1;
    var daysInMonth = new Date(calYear, calMonth, 0).getDate();
    var booked = bookedByDay();
    var conflictDays = {};
    if (startDay) {
      findConflicts(startDay, endDay || startDay).forEach(function(c) { conflictDays[c.day] = true; });
    }

    for (var i = 0; i < offset; i++) {
      var blank = document.createElement('div');
      blank.className = 'cal-day empty';
      grid.appendChild(blank);
    }
    for (var d = 1; d <= daysInMonth; d++) {
      (function(day) {
        var wd = new Date(calYear, calMonth - 1, day).getDay();
        var div = document.createElement('div');
        div.className = 'cal-day';
        var num = document.createElement('span');
        num.textContent = day;
        div.appendChild(num);
        if (wd === 6) div.classList.add('sat');
        if (wd === 0) div.classList.add('sun');
        if (startDay && endDay && day > startDay && day < endDay) div.classList.add('in-range');
        if (startDay && day === startDay) div.classList.add('start');
        if (endDay && day === endDay) div.classList.add('end');
        if (conflictDays[day]) div.classList.add('conflict');
        // 登録済みの予定は取引先の色の帯で示す
        var s = booked[day];
        if (s) {
          var mark = document.createElement('span');
          mark.className = 'cal-mark' + (isEditingShift(s) ? ' editing' : '');
          mark.style.background = torihikiColor(s.torihiki);
          div.appendChild(mark);
        }
        div.onclick = function() {
          var wasComplete = !!(startDay && endDay);
          if (!startDay || (startDay && endDay)) {
            startDay = day; endDay = null;
          } else {
            if (day < startDay) { endDay = startDay; startDay = day; }
            else { endDay = day; }
          }
          if (navigator.vibrate) navigator.vibrate(10);
          renderCal();
          updateSummary();
          updateProgress();
          if (!wasComplete && startDay && endDay && !editMode) {
            scrollToNextAfter('date');
          }
        };
        grid.appendChild(div);
      })(d);
    }
    updateRangeInfo();
    renderBookedList();
  }

  function updateRangeInfo() {
    var el = document.getElementById('rangeInfo');
    var text, cls = 'range-info';
    if (startDay && endDay) {
      cls += ' set';
      text = calMonth + '月' + startDay + '日 〜 ' + calMonth + '月' + endDay + '日（' + (endDay - startDay + 1) + '日間）';
    } else if (startDay) {
      cls += ' set';
      text = calMonth + '月' + startDay + '日 → 終了日をタップ（1日だけならもう一度同じ日）';
    } else {
      text = '開始日をタップ';
    }
    if (startDay) {
      var conf = findConflicts(startDay, endDay || startDay);
      if (conf.length) {
        cls = 'range-info warn';
        text += '\n⚠️ 予定あり: ' + describeConflicts(conf).join('、') + '（送信すると上書きされます）';
      }
    }
    el.className = cls;
    el.style.whiteSpace = 'pre-line';
    el.textContent = text;
  }

  // カレンダーの下に「登録済みの予定」を一覧表示する
  function renderBookedList() {
    var el = document.getElementById('bookedList');
    el.innerHTML = '';
    if (!sel.name || !monthLoaded) { el.style.display = 'none'; return; }
    el.style.display = 'block';

    var head = document.createElement('div');
    head.className = 'booked-head';
    head.textContent = sel.name + 'さんの登録済みの予定';
    el.appendChild(head);

    function note(text) {
      var n = document.createElement('div');
      n.className = 'booked-note';
      n.textContent = text;
      el.appendChild(n);
      return n;
    }

    if (shiftCache.name !== sel.name || shiftCache.promise) { note('読み込み中…'); return; }
    if (shiftCache.error) {
      var n = note('読み込めませんでした');
      var retry = document.createElement('button');
      retry.className = 'btn-retry';
      retry.textContent = '再試行';
      retry.onclick = function() { fetchMyShifts(sel.name, true); };
      n.appendChild(retry);
      return;
    }
    var list = monthShifts();
    if (!list.length) { note('この月の予定はまだありません'); return; }
    list.forEach(function(s) {
      var item = document.createElement('div');
      item.className = 'booked-item';
      var dot = document.createElement('span');
      dot.className = 'booked-dot';
      dot.style.background = torihikiColor(s.torihiki);
      var txt = document.createElement('span');
      var range = Number(s.startDay) === Number(s.endDay) ? s.startDay + '日' : s.startDay + '〜' + s.endDay + '日';
      txt.textContent = range + '　' + s.torihiki + (s.place ? '・' + s.place : '') + (isEditingShift(s) ? '（修正中）' : '');
      item.appendChild(dot);
      item.appendChild(txt);
      el.appendChild(item);
    });
  }

  // ===== 送信バーのサマリー =====
  function updateSummary() {
    var parts = [];
    if (sel.name) parts.push(sel.name);
    if (sel.torihiki) parts.push(sel.torihiki);
    if (sel.carrier) parts.push(sel.carrier);
    if (startDay) parts.push(calMonth + '/' + startDay + (endDay && endDay !== startDay ? '〜' + endDay : ''));
    var place = document.getElementById('place').value;
    if (place) parts.push(place);
    document.getElementById('summary').textContent = parts.join(' ｜ ');
  }

  // ===== 送信 =====
  function submitForm() {
    if (submitting) return;
    var miss = missingSteps();
    if (miss.length) { focusStep(miss[0]); return; }
    if (!monthLoaded) { showToast('シフト表の読み込みが終わってから送信してください', 'error'); return; }

    var data = {
      name: sel.name,
      torihiki: sel.torihiki,
      carrier: sel.carrier,
      startDay: startDay,
      endDay: endDay || startDay,
      place: document.getElementById('place').value,
      hotel: document.getElementById('hotel').value,
      year: calYear,
      month: calMonth
    };
    if (!data.name) { showToast('名前を選択してください', 'error'); return; }

    var payload = { data: data };
    // 修正モードでは元レコードのキーを付ける（GAS側で該当行を更新するために必要）
    if (editMode && editOriginal) payload.original = editOriginal;
    var wasEdit = editMode;

    setSubmitting('確認中…');
    // GASは既存の予定を黙って上書きするので、重なる日があれば先に確認する
    confirmOverwrite(data.startDay, data.endDay)
      .then(function(ok) {
        if (!ok) { setSubmitting(false); return; }
        setSubmitting('送信中…');
        return callApi('submitShift', payload).then(function() {
          if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

          startDay = null; endDay = null;
          document.getElementById('place').value = '';
          document.getElementById('hotel').value = '';
          exitEditMode();
          setSubmitting(false);
          updateSummary();
          updateProgress();
          fetchMyShifts(sel.name, true);

          showDoneSheet(data, wasEdit);
        });
      })
      .catch(function(err) {
        setSubmitting(false);
        showToast('⚠️ ' + err.message, 'error');
        if (navigator.vibrate) navigator.vibrate(80);
      });
  }

  // 送信完了のシート。続けて入力するか、確認タブへ行くかを選べる。
  function showDoneSheet(data, wasEdit) {
    showDialog({
      icon: 'check',
      title: wasEdit ? '修正しました' : '登録しました',
      text: data.name + 'さんのシフトをシフト表に書き込みました。',
      body: shiftSummaryNode(data),
      actions: [
        { label: '続けて別の日を入力', kind: 'primary', value: 'continue' },
        { label: '確認タブで見る', kind: 'ghost', value: 'confirm' }
      ],
      cancelValue: 'continue'
    }).then(function(v) {
      if (v === 'confirm') { switchTab('confirm'); window.scrollTo(0, 0); }
      else scrollToStep('date');
    });
  }

  // 重なる予定があれば上書きしてよいか聞く。true なら送信してよい。
  function confirmOverwrite(from, to) {
    return fetchMyShifts(sel.name).then(function() {
      var conf = findConflicts(from, to);
      if (!conf.length) return true;
      var list = document.createElement('div');
      list.className = 'conf-list';
      groupConflicts(conf).forEach(function(g) {
        var item = document.createElement('div');
        item.className = 'conf-item';
        var dot = document.createElement('span');
        dot.className = 'booked-dot';
        dot.style.background = torihikiColor(g.shift.torihiki);
        var txt = document.createElement('span');
        txt.textContent = describeConflictGroup(g);
        item.appendChild(dot);
        item.appendChild(txt);
        list.appendChild(item);
      });
      return showDialog({
        icon: 'warn',
        title: '予定が重なっています',
        text: '次の日には既に予定が入っています。送信すると上書きされます。',
        body: list,
        actions: [
          { label: '上書きして送信', kind: 'danger', value: true },
          { label: 'やめる', kind: 'ghost', value: false, focus: true }
        ],
        cancelValue: false
      });
    }, function() {
      return showDialog({
        icon: 'warn',
        title: '予定を確認できませんでした',
        text: '通信エラーのため、重なる予定があるか確認できませんでした。このまま送信しますか？',
        actions: [
          { label: 'このまま送信', kind: 'primary', value: true },
          { label: 'やめる', kind: 'ghost', value: false, focus: true }
        ],
        cancelValue: false
      });
    });
  }

  // ===== 共通部品：ダイアログ・トースト・予定カード =====
  var ICONS = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/></svg>'
  };

  // 下から出るダイアログ。押されたボタンの value で resolve する。
  function showDialog(opt) {
    return new Promise(function(resolve) {
      var prevFocus = document.activeElement;
      var closed = false;
      var ov = document.createElement('div');
      ov.className = 'overlay';
      var sh = document.createElement('div');
      sh.className = 'sheet';
      sh.setAttribute('role', 'dialog');
      sh.setAttribute('aria-modal', 'true');
      sh.tabIndex = -1;

      if (opt.icon) {
        var ic = document.createElement('div');
        ic.className = 'sheet-icon ' + opt.icon;
        ic.innerHTML = ICONS[opt.icon];
        sh.appendChild(ic);
      }
      var t = document.createElement('div');
      t.className = 'sheet-title';
      t.id = 'sheet-title';
      t.textContent = opt.title;
      sh.appendChild(t);
      sh.setAttribute('aria-labelledby', 'sheet-title');
      if (opt.text) {
        var tx = document.createElement('div');
        tx.className = 'sheet-text';
        tx.textContent = opt.text;
        sh.appendChild(tx);
      }
      if (opt.body) {
        var b = document.createElement('div');
        b.className = 'sheet-body';
        b.appendChild(opt.body);
        sh.appendChild(b);
      }
      var acts = document.createElement('div');
      acts.className = 'sheet-actions';
      var focusEl = null;
      opt.actions.forEach(function(a) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-' + a.kind;
        btn.textContent = a.label;
        btn.onclick = function() { close(a.value); };
        if (a.focus) focusEl = btn;
        acts.appendChild(btn);
      });
      sh.appendChild(acts);
      ov.appendChild(sh);

      function onKey(e) { if (e.key === 'Escape') close(opt.cancelValue); }
      function close(v) {
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', onKey);
        ov.classList.remove('show');
        document.body.style.overflow = '';
        setTimeout(function() { ov.remove(); }, 220);
        if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true });
        resolve(v);
      }
      ov.addEventListener('click', function(e) { if (e.target === ov) close(opt.cancelValue); });
      document.addEventListener('keydown', onKey);

      document.body.appendChild(ov);
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(function() { ov.classList.add('show'); });
      (focusEl || sh).focus({ preventScroll: true });
    });
  }

  var toastTimer = null;
  function showToast(msg, kind) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (kind === 'error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.className = 'toast' + (kind === 'error' ? ' error' : ''); },
      kind === 'error' ? 4500 : 2500);
  }

  // 「9月12日(金)〜14日(日)」の形
  function formatRange(y, m, from, to) {
    y = Number(y); m = Number(m); from = Number(from); to = Number(to);
    function wd(d) {
      var dt = new Date(y, m - 1, d);
      return isNaN(dt.getTime()) ? '' : '(' + '日月火水木金土'[dt.getDay()] + ')';
    }
    var txt = m + '月' + from + '日' + wd(from);
    if (to && to !== from) txt += '〜' + to + '日' + wd(to);
    return txt;
  }

  // 予定の中身をカードにする（完了シート・削除確認で使う）
  function shiftSummaryNode(s) {
    var card = document.createElement('div');
    card.className = 'sum-card';
    card.style.borderLeftColor = torihikiColor(s.torihiki);
    var d = document.createElement('div');
    d.className = 'sum-date';
    d.textContent = formatRange(s.year, s.month, s.startDay, s.endDay);
    card.appendChild(d);
    [['取引先', s.torihiki], ['キャリア', s.carrier], ['開催場所', s.place], ['ホテル', s.hotel]]
      .forEach(function(r) {
        if (!r[1]) return;
        var row = document.createElement('div');
        row.className = 'sum-row';
        var k = document.createElement('span');
        k.textContent = r[0];
        var v = document.createElement('span');
        v.textContent = r[1];
        row.appendChild(k);
        row.appendChild(v);
        card.appendChild(row);
      });
    return card;
  }

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ===== 確認・修正 =====
  function loadMyShifts() {
    var listEl = document.getElementById('shift-list');
    if (!confirmName) { listEl.innerHTML = '<div class="empty-msg">上から名前を選択してください</div>'; return; }
    listEl.innerHTML = '<div class="loading-msg">読み込み中...</div>';
    fetchMyShifts(confirmName, true)
      .then(function(shifts) { renderShiftList(shifts); })
      .catch(function(err) {
        listEl.innerHTML = '<div class="empty-msg">⚠️ 読み込みエラー: ' + escapeHtml(err.message) + '<br><button class="btn-retry" style="margin-top:10px;" onclick="loadMyShifts()">再試行</button></div>';
      });
  }

  var loadedShifts = [];
  function renderShiftList(shifts) {
    loadedShifts = shifts || [];
    var listEl = document.getElementById('shift-list');
    if (loadedShifts.length === 0) {
      listEl.innerHTML = '<div class="empty-msg">入力済みのシフトはありません</div>';
      return;
    }
    var html = '';
    loadedShifts.forEach(function(s, i) {
      var dateStr = s.month + '月' + s.startDay + '日';
      if (s.startDay !== s.endDay) dateStr += ' 〜 ' + s.month + '月' + s.endDay + '日';
      html += '<div class="shift-item">';
      html += '<div class="date-label">📅 ' + escapeHtml(dateStr) + '</div>';
      html += '<div class="detail"><span>取引先</span>' + escapeHtml(s.torihiki) + '</div>';
      html += '<div class="detail"><span>キャリア</span>' + escapeHtml(s.carrier) + '</div>';
      html += '<div class="detail"><span>開催場所</span>' + escapeHtml(s.place) + '</div>';
      if (s.hotel) html += '<div class="detail"><span>ホテル</span>' + escapeHtml(s.hotel) + '</div>';
      html += '<div class="shift-actions">';
      html += '<button class="btn-edit" onclick="editShift(' + i + ')">✏️ 修正</button>';
      html += '<button class="btn-delete" onclick="deleteShift(' + i + ')">🗑 削除</button>';
      html += '</div></div>';
    });
    listEl.innerHTML = html;
  }

  function editShift(i) {
    var shift = loadedShifts[i];
    switchTab('input');

    sel.name = confirmName;
    sel.torihiki = shift.torihiki;
    sel.carrier = shift.carrier;
    selectChip('chips-name', confirmName);
    selectChip('chips-torihiki', shift.torihiki);
    selectChip('chips-carrier', shift.carrier);
    document.getElementById('place').value = shift.place;
    document.getElementById('hotel').value = shift.hotel || '';
    startDay = Number(shift.startDay);
    endDay = Number(shift.endDay);

    editMode = true;
    editOriginal = {
      id: (shift.id !== undefined ? shift.id : null),
      row: (shift.row !== undefined ? shift.row : null),
      name: confirmName,
      year: shift.year,
      month: shift.month,
      startDay: shift.startDay,
      endDay: shift.endDay,
      torihiki: shift.torihiki
    };
    expanded = {};
    document.getElementById('edit-banner').classList.add('show');
    renderCal();
    updateSummary();
    updateProgress();
    window.scrollTo(0, 0);
  }

  function exitEditMode() {
    editMode = false;
    editOriginal = null;
    document.getElementById('edit-banner').classList.remove('show');
    renderCal();
    updateSubmitButton();
  }

  function cancelEdit() {
    exitEditMode();
    startDay = null; endDay = null;
    document.getElementById('place').value = '';
    document.getElementById('hotel').value = '';
    renderCal();
    updateSummary();
    updateProgress();
    switchTab('confirm');
    window.scrollTo(0, 0);
  }

  function deleteShift(i) {
    var s = loadedShifts[i];
    var name = confirmName;
    showDialog({
      icon: 'trash',
      title: 'この予定を削除しますか？',
      text: name + 'さんの予定をシフト表から消します。元に戻せません。',
      body: shiftSummaryNode(s),
      actions: [
        { label: '削除する', kind: 'danger', value: true },
        { label: 'やめる', kind: 'ghost', value: false, focus: true }
      ],
      cancelValue: false
    }).then(function(ok) {
      if (ok) doDelete(s, name);
    });
  }

  function doDelete(s, confirmName) {
    // 年月と取引先まで送って対象行を一意に絞る。
    // これが無いと別の月の同じ日程まで消える恐れがある。
    callApi('deleteShift', {
      id: (s.id !== undefined ? s.id : null),
      row: (s.row !== undefined ? s.row : null),
      name: confirmName,
      year: s.year,
      month: s.month,
      startDay: s.startDay,
      endDay: s.endDay,
      torihiki: s.torihiki
    })
      .then(function() { showToast('削除しました'); loadMyShifts(); })
      .catch(function(err) { showToast('⚠️ 削除エラー: ' + err.message, 'error'); });
  }
</script>
</body>
